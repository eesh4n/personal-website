<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Eeshan Agarwal: engineering + Ivey HBA at Western University. Projects, experience, and resume.">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0908'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-style='italic' text-anchor='middle' fill='%23e3bc72'%3EE%3C/text%3E%3C/svg%3E">
<title>Eeshan Agarwal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Tiro+Devanagari+Hindi:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: a one-screen gallery. On desktop the particle exhibit fills the whole window and the text floats over it: a quiet serif index on the left, the reading panel on the right (with a soft scrim for legibility), a museum placard under the sculpture. Phones = sticky exhibit on top, index as a scrolling row, panel below. Single committed dark world. */
:root {
  --bg: #0a0908;
  --line: rgba(241, 237, 230, 0.1);
  --line-2: rgba(241, 237, 230, 0.18);
  --text: #f2eee7;
  --soft: #d8d2c8;
  --muted: #958f86;
  --faint: #5f5a54;
  --gold: #e3bc72;
  --c: #e3bc72;
  --colL: 250px;
  --colR: 460px;
  --f-serif: "Instrument Serif", "Times New Roman", Georgia, serif;
  --f-sans: "Geist", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--f-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 1.5px solid var(--c); outline-offset: 3px; }
em { font-family: var(--f-serif); font-style: italic; font-weight: 400; color: var(--c); font-size: 1.08em; transition: color .5s; }

/* ---------- exhibit (full window on desktop) ---------- */
.stage { position: fixed; inset: 0; z-index: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 60% 70% at calc(var(--colL) + (100% - var(--colL) - var(--colR)) / 2) 47%, transparent 55%, rgba(10,9,8,0.5) 85%, rgba(10,9,8,0.8) 100%); }
.scrim-r { position: fixed; top: 0; bottom: 0; right: 0; width: calc(var(--colR) + 140px); z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(10,9,8,0) 0%, rgba(10,9,8,0.82) 32%, rgba(10,9,8,0.92) 100%); }
.scrim-l { position: fixed; top: 0; bottom: 0; left: 0; width: calc(var(--colL) + 80px); z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0.3) 60%, rgba(10,9,8,0) 100%); }
.placard {
  position: fixed; z-index: 2; left: calc(var(--colL) + 24px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
  max-width: 340px; pointer-events: none; border-left: 1px solid var(--c); padding: 2px 0 2px 14px; transition: border-color .5s;
}
.placard b { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c); transition: color .5s; }
.placard span { display: block; margin-top: 4px; font-family: var(--f-serif); font-style: italic; font-size: 17px; line-height: 1.3; color: #bcb5aa; }
.placard.swap { animation: plac .7s ease both; }
@keyframes plac { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hint {
  position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 72px); left: calc(var(--colL) + (100% - var(--colL) - var(--colR)) / 2); transform: translateX(-50%);
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #5a554f; white-space: nowrap; pointer-events: none; transition: opacity .6s;
}
.hint.gone { opacity: 0; }
.modes { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 28px); left: calc(var(--colL) + (100% - var(--colL) - var(--colR)) / 2); transform: translateX(-50%);
  display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,9,8,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.mode { border: 0; background: none; border-radius: 999px; padding: 5px 11px; font-family: var(--f-serif); font-style: italic; font-size: 15px; line-height: 1.2; color: #7d776e; transition: color .25s, background .25s; }
.mode:hover { color: var(--text); }
.mode[aria-pressed="true"] { background: var(--c); color: var(--bg); }
.page-link { position: absolute; z-index: 1; left: 50%; top: 50%; width: 300px; height: 400px; transform: translate(-50%, -50%); border-radius: 10px; cursor: pointer; }
.page-link span { position: absolute; left: 50%; bottom: 12%; transform: translate(-50%, 8px); padding: 7px 13px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .3s; }
.page-link:hover span, .page-link:focus-visible span { opacity: 1; transform: translate(-50%, 0); }

/* ---------- floating columns ---------- */
.app { position: relative; z-index: 3; display: grid; grid-template-columns: var(--colL) minmax(0, 1fr) var(--colR); height: 100%; pointer-events: none; }
.index, .panel { pointer-events: auto; }

.index {
  display: flex; flex-direction: column; justify-content: space-between; gap: 32px; min-height: 0; overflow-y: auto; scrollbar-width: none;
  padding: calc(env(safe-area-inset-top, 0px) + 38px) 12px calc(env(safe-area-inset-bottom, 0px) + 34px) max(40px, env(safe-area-inset-left, 0px));
}
.index::-webkit-scrollbar { display: none; }
.mark { display: grid; width: max-content; font-family: var(--f-serif); font-size: 30px; line-height: 0.95; letter-spacing: -0.015em; cursor: default; }
.mark > span { grid-area: 1 / 1; transition: opacity .45s, transform .55s cubic-bezier(.2,.7,.2,1), filter .45s; }
.mark i { display: block; font-style: italic; color: var(--muted); }
.mark .hi { font-family: "Tiro Devanagari Hindi", var(--f-serif); font-size: 29px; line-height: 1.12; letter-spacing: 0; opacity: 0; transform: translateY(8px); filter: blur(4px); }
.mark .hi i { font-style: normal; color: var(--c); }
.mark:hover .en { opacity: 0; transform: translateY(-8px); filter: blur(4px); }
.mark:hover .hi { opacity: 1; transform: none; filter: none; }
.groups { display: flex; flex-direction: column; gap: 30px; }
.group h3 { margin: 0 0 8px; font-family: var(--f-mono); font-weight: 400; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #4f4a44; }
.item {
  position: relative; display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0;
  color: #706a62; font-family: var(--f-serif); font-size: 22px; line-height: 1.2;
  transition: color .35s, transform .45s cubic-bezier(.2,.7,.2,1);
  animation: inItem .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--n) * 60ms + 200ms);
}
@keyframes inItem { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
.item::before { content: ""; position: absolute; left: -18px; top: 50%; width: 9px; height: 1px; background: var(--ic, var(--c)); transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.item:hover { color: #c9c2b8; transform: translateX(4px); }
.item[aria-current="true"] { color: var(--text); font-style: italic; transform: translateX(6px); }
.item[aria-current="true"]::before { transform: scaleX(1); }
.socials { display: grid; gap: 9px; }
.socials a { display: flex; justify-content: space-between; align-items: center; max-width: 150px; color: #7c766d; text-decoration: none; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; transition: color .25s, transform .3s; }
.socials a i { font-style: normal; opacity: 0; transform: translate(-4px, 4px); transition: opacity .25s, transform .3s; }
.socials a:hover { color: var(--text); }
.socials a:hover i { opacity: 1; transform: none; }
.visits { margin-top: 18px; display: flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; color: #7c766d; animation: slideVisits .9s cubic-bezier(.2,.7,.2,1) 1s both; }
.visits i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); transition: background .5s; }
.visits b { font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
@keyframes slideVisits { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.keys { margin-top: 10px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #46423d; }

.index .mark, .index .item, .index .group h3, .index .socials a, .index .keys, .index .visits { text-transform: lowercase; }

.m-foot { display: none; position: relative; z-index: 1; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; margin: 0 16px; padding: 18px 0 calc(env(safe-area-inset-bottom, 0px) + 26px); border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; color: #7c766d; }
.m-foot b { font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
.m-foot div { display: flex; gap: 14px; }
.m-foot a { color: #9b958c; text-decoration: none; }

/* ---------- panel ---------- */
.panel { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #26231f transparent;
  padding: calc(env(safe-area-inset-top, 0px) + 38px) max(44px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 44px) 16px; }
.panel-inner { display: flex; flex-direction: column; gap: 22px; }
.panel-inner.enter > * { animation: rise .65s cubic-bezier(.2,.7,.2,1) both; }
.panel-inner.enter > *:nth-child(2) { animation-delay: .05s; } .panel-inner.enter > *:nth-child(3) { animation-delay: .1s; }
.panel-inner.enter > *:nth-child(4) { animation-delay: .15s; } .panel-inner.enter > *:nth-child(5) { animation-delay: .2s; }
.panel-inner.enter > *:nth-child(6) { animation-delay: .25s; } .panel-inner.enter > *:nth-child(n+7) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.kicker { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.kicker b { font-weight: 400; color: var(--c); transition: color .5s; }
.panel h1 { margin: -6px 0 0; font-family: var(--f-serif); font-weight: 400; font-size: clamp(48px, 4.8vw, 70px); line-height: 0.9; letter-spacing: -0.028em; text-wrap: balance; }
.role { margin: -10px 0 0; font-size: 13.5px; color: var(--muted); }
.pitch { margin: 0; font-size: 18px; font-weight: 300; line-height: 1.5; color: var(--soft); max-width: 36ch; text-wrap: pretty; }

.award { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 16px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgba(227,188,114,0.15), rgba(227,188,114,0.03) 60%); border: 1px solid rgba(227,188,114,0.36); }
.award::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,235,190,0.16), transparent); animation: sheen 5s ease-in-out 1s infinite; }
@keyframes sheen { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.award-place { font-family: var(--f-serif); font-size: 60px; line-height: 0.8; color: var(--gold); letter-spacing: -0.03em; }
.award-place sup { font-size: 0.38em; vertical-align: top; position: relative; top: 0.18em; margin-left: 1px; font-style: italic; }
.award b { display: block; font-weight: 500; font-size: 15.5px; }
.award span { display: block; margin-top: 3px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #b9a580; }

.stats { display: grid; grid-template-columns: repeat(var(--k, 3), minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 10px 13px 0; min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat strong { display: block; font-family: var(--f-serif); font-weight: 400; font-size: 36px; line-height: 0.95; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.stats.one .stat { display: flex; align-items: baseline; gap: 12px; }
.stats.one .stat span { margin: 0; font-size: 13.5px; }

.label { margin: 4px 0 -12px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
.problem { margin: 0; font-family: var(--f-serif); font-style: italic; font-size: 21px; line-height: 1.35; color: #cbc4b9; text-wrap: pretty; }
.did { list-style: none; margin: 0; padding: 0; display: grid; }
.did li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.did li:first-child { border-top: 1px solid var(--line); }
.did strong { font-family: var(--f-serif); font-weight: 400; font-size: 23px; line-height: 1.05; color: var(--c); transition: color .5s; }
.did span { color: var(--soft); font-size: 14px; line-height: 1.55; }
.impact { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.impact li { position: relative; padding-left: 26px; color: var(--soft); font-size: 14.5px; line-height: 1.55; }
.impact li::before { content: "↗"; position: absolute; left: 0; top: 0; color: var(--c); font-size: 13px; transition: color .5s; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-family: var(--f-mono); font-size: 10.5px; color: #a49d93; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.note { margin: 0; font-size: 13px; color: var(--muted); font-style: italic; }

/* action buttons (project links) */
.actions { display: grid; gap: 8px; }
.act { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 14px 13px 20px; border-radius: 16px; text-decoration: none;
  border: 1px solid var(--line-2); background: rgba(255,255,255,0.015); transition: border-color .3s, background .3s, transform .35s cubic-bezier(.2,.7,.2,1); }
.act b { display: block; font-family: var(--f-serif); font-weight: 400; font-size: 22px; line-height: 1.05; }
.act small { display: block; margin-top: 3px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.act .ring { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); font-size: 13px; transition: transform .4s cubic-bezier(.2,.7,.2,1), background .3s, color .3s, border-color .3s; }
.act:hover { border-color: color-mix(in srgb, var(--c) 60%, transparent); transform: translateY(-1px); }
.act:hover .ring { transform: rotate(45deg); background: var(--c); color: var(--bg); border-color: var(--c); }
.act.primary { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: linear-gradient(120deg, color-mix(in srgb, var(--c) 18%, transparent), rgba(255,255,255,0.01) 70%); }
.act.primary .ring { background: var(--c); color: var(--bg); border-color: var(--c); }

/* link tiles (Me / Contact) */
.linkgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { --b: var(--c); position: relative; display: flex; flex-direction: column; gap: 16px; padding: 14px; border-radius: 18px; text-decoration: none; overflow: hidden;
  border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012)); transition: border-color .35s, transform .4s cubic-bezier(.2,.7,.2,1); }
.tile::before { content: ""; position: absolute; width: 130px; height: 130px; top: -60px; left: -50px; border-radius: 50%; background: var(--b); opacity: 0; filter: blur(34px); transition: opacity .4s; pointer-events: none; }
.tile > * { position: relative; }
.tile-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.06); color: var(--text); transition: background .35s, color .35s, transform .4s cubic-bezier(.2,.7,.2,1); }
.tile-ico svg { width: 21px; height: 21px; display: block; }
.tile b { display: block; font-family: var(--f-serif); font-weight: 400; font-size: 23px; line-height: 1; }
.tile small { display: block; margin-top: 5px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.02em; color: var(--muted); overflow-wrap: anywhere; }
.tile > i { position: absolute; top: 15px; right: 15px; font-style: normal; font-size: 13px; color: var(--faint); transition: transform .35s cubic-bezier(.2,.7,.2,1), color .3s; }
.tile:hover { border-color: color-mix(in srgb, var(--b) 65%, transparent); transform: translateY(-3px); }
.tile:hover::before { opacity: 0.38; }
.tile:hover .tile-ico { background: var(--b); color: var(--on, #fff); transform: scale(1.06); }
.tile:hover > i { transform: translate(3px, -3px); color: var(--text); }
.email { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 18px; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012)); transition: border-color .35s, transform .4s cubic-bezier(.2,.7,.2,1); }
.email-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: var(--bg); transition: transform .4s cubic-bezier(.2,.7,.2,1), background .5s; }
.email-ico svg { width: 21px; height: 21px; display: block; }
.email span b { display: block; font-family: var(--f-serif); font-weight: 400; font-size: 21px; line-height: 1; }
.email span small { display: block; margin-top: 5px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.email:hover { border-color: color-mix(in srgb, var(--c) 65%, transparent); transform: translateY(-2px); }
.email:hover .email-ico { transform: rotate(-8deg) scale(1.07); }
.copy { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; transition: border-color .25s, background .25s, color .25s; }
.copy:hover { background: var(--c); color: var(--bg); border-color: var(--c); }

/* about rows */
.rows { margin: 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); border-top: 1px solid var(--line); }
.rows dt, .rows dd { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rows dt { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); padding-top: 18px; }
.rows dd { font-size: 15px; line-height: 1.45; }
.rows dd small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.uni { display: grid; gap: 12px; }
.uni-logos { display: flex; gap: 8px; }
.uni-logos a { display: block; height: 58px; background: #fff; border-radius: 12px; padding: 6px 10px; transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .35s; }
.uni-logos a:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.45); }
.uni-logos img { display: block; height: 100%; width: auto; }
.inlink { color: var(--text); text-decoration: underline; text-decoration-color: var(--c); text-decoration-thickness: 1px; text-underline-offset: 4px; transition: color .25s; }
.inlink:hover { color: var(--c); }
.inlink i { font-style: normal; font-size: 12px; margin-left: 2px; color: var(--c); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fd393; margin-right: 8px; vertical-align: 2px; box-shadow: 0 0 0 3px rgba(95,211,147,0.14); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(95,211,147,0); } }

/* resume sheet */
.sheet { display: grid; gap: 20px; }
.sheet h4 { margin: 0 0 8px; font-family: var(--f-mono); font-weight: 400; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c); transition: color .5s; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.entry b { font-family: var(--f-serif); font-weight: 400; font-size: 20px; line-height: 1.15; }
.entry time { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding-top: 4px; }
.entry span { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.entry span strong { color: var(--gold); font-weight: 500; }

/* recording card */

var VERT = [

  "varying vec3 vColor; varying float vLift;",
  "float ease(float t){ return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t + 2.0, 3.0) / 2.0; }",

  "  float t = clamp((uP - aSeed * 0.35) / 0.65, 0.0, 1.0); float e = ease(t);",
  "  vec3 p = mix(aFrom, aTo, e);",
  "  float T = uTime; vec3 d = vec3(0.0); float g = 0.0;",
  /* sentiment: waves roll along each ridgeline and a scanner sweeps across */

  "  }",
  /* 0DTE: the surface breathes and a price line sweeps the strike */

  /* RivalRuns: frames light up in sequence like a strobe, the ground scrolls, the webcam blinks */

  "    d.y = sin(T * 1.1 + aTag * 0.9) * 0.9; d.z = cos(T * 0.9 + aTag * 1.3) * 0.7; d.x = sin(T * 0.7 + aTag) * 0.4;",
  "    if (aTag > 3.5) g = exp(-pow((p.x + p.y * 0.6 - (mod(T * 14.0, 90.0) - 45.0)) / 2.4, 2.0)) * 0.9;",
  "  }",
  /* Calmpost: the sapling sways, bubbles rise, sensors pulse */
  "  else if (uMode < 5.5) {",
  "    if (aTag > 3.5 && aTag < 5.5) { float h = max(0.0, p.y + 7.0) / 30.0; d.x = sin(T * 1.3) * h * 2.0; d.z = cos(T * 1.05) * h * 1.3; d.y = sin(T * 2.0 + p.x) * h * 0.4; }",
  "    else if (aTag > 5.5) { float ny = mod(p.y + 6.0 + T * 4.0 + aSeed * 30.0, 30.0) - 6.0; d.y = ny - p.y; g = -smoothstep(16.0, 24.0, ny) * 0.9; }",
  "    else if (aTag > 2.5) g = (sin(T * 3.0 + aSeed * 3.0) * 0.5 + 0.5) * 1.0;",
  "  }",
  /* Resume: the page flutters and a reading line scans down it */
  "  else if (uMode < 6.5) {",
  "    d.z = sin(p.y * 0.12 + T * 1.4) * 0.9 * (p.x + 22.0) / 44.0;",
  "    if (aTag > 1.5) g = exp(-pow((p.y - (24.0 - mod(T * 7.0, 56.0))) / 1.6, 2.0)) * 1.0;",
  "  }",
  /* Contact: the plane glides and its trail flows */
  "  else if (uMode < 7.5) {",
  "    d.y = sin(T * 1.2) * 1.3; d.x = cos(T * 0.9) * 0.7; d.z = sin(T * 0.8) * 0.5;",
  "    if (aTag > 0.5) { g = pow(0.5 + 0.5 * sin(aTag * 60.0 - T * 6.0), 4.0) * 1.2 - max(uFly, 1.0 - uArrive); d *= 1.0 - (aTag - 1.0) * 0.7; }",
  "    else { float fl = clamp(uFly * 1.3 - aSeed * 0.3, 0.0, 1.0); float ar = clamp((1.0 - uArrive) * 1.3 - aSeed * 0.3, 0.0, 1.0); d += vec3(230.0, 70.0, 40.0) * fl * fl + vec3(-230.0, -50.0, -30.0) * ar * ar; }",
  "  }",
  "  p += d * e * uMotion; g *= e * uMotion;",
  "  float s = sin(t * 3.14159) * uMotion; float sw = aSeed * 6.283 + T * 0.8;",
  "  p += vec3(cos(sw) * 8.0, sin(sw * 1.3) * 5.0, sin(sw) * 8.0) * s;",
  "  p.z += sin(T * 0.8 + aSeed * 6.283) * 0.22 * uMotion;",
  "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
  "  vec2 dm = mv.xy - uMouse; float dist = length(dm); vec2 dir = dm / max(dist, 0.001); float f = 0.0; float on = uMouseOn * uMotion;",
  "  if (uCursor < 0.5) {",

  "    f = on * (1.0 - smoothstep(0.0, 18.0, dist)); float ang = f * f * 2.4 + f * sin(T * 1.5) * 0.25; float ca = cos(ang), sa = sin(ang);",

  "    f = on * (1.0 - smoothstep(0.0, 20.0, dist)); mv.xy -= dm * f * f * 0.82; mv.z += f * 4.0;",
  "  } else {",
  "    f = on * (1.0 - smoothstep(0.0, 14.0, dist)); float n = fract(aSeed * 91.7) * 6.283;",

var FRAG = "varying vec3 vColor; varying float vLift; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard; vec3 c = vColor * (1.0 + vLift * 0.75) + vec3(0.06, 0.05, 0.03) * vLift; gl_FragColor = vec4(c, smoothstep(0.5, 0.2, d)); }";

function Particles(canvas) {
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor("#0a0908", 1);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 800); camera.position.z = 100;
  var small = window.innerWidth <= 860;
  var N = small ? 26000 : 50000, DUR = 2.0;

  var from = new Float32Array(N * 3), to = new Float32Array(N * 3), cFrom = new Float32Array(N * 3), cTo = new Float32Array(N * 3), seed = new Float32Array(N), tag = new Float32Array(N);
  for (var i = 0; i < N; i++) {
    var r = 80 + Math.random() * 80, a = Math.random() * 6.283, bb = Math.acos(2 * Math.random() - 1);
    from[i * 3] = r * Math.sin(bb) * Math.cos(a); from[i * 3 + 1] = r * Math.sin(bb) * Math.sin(a); from[i * 3 + 2] = r * Math.cos(bb) - 70;
    cFrom[i * 3] = cFrom[i * 3 + 1] = cFrom[i * 3 + 2] = 0.25; seed[i] = Math.random();
  }
  to.set(from); cTo.set(cFrom);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  ["aFrom", "aTo", "aCFrom", "aCTo"].forEach(function (n, j) { geo.setAttribute(n, new THREE.BufferAttribute([from, to, cFrom, cTo][j], 3)); });
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
  geo.setAttribute("aTag", new THREE.BufferAttribute(tag, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 500);

  var U = {
    uP: { value: 1 }, uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(9999, 9999) }, uMouseOn: { value: 0 }, uMode: { value: 0 }, uCursor: { value: 0 }, uFly: { value: 0 }, uArrive: { value: 1 },
    uSize: { value: small ? 2.5 : 2.15 }, uPR: { value: renderer.getPixelRatio() }, uScale: { value: 1 }, uMotion: { value: reduce ? 0 : 1 }
  };
  var points = new THREE.Points(geo, new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false, vertexShader: VERT, fragmentShader: FRAG }));
  scene.add(points);

  var D = small ? 500 : 1200, dPos = new Float32Array(D * 3);
  for (i = 0; i < D; i++) { dPos[i * 3] = (Math.random() - 0.5) * 260; dPos[i * 3 + 1] = (Math.random() - 0.5) * 150; dPos[i * 3 + 2] = -40 - Math.random() * 90; }
  var dGeo = new THREE.BufferGeometry(); dGeo.setAttribute("position", new THREE.BufferAttribute(dPos, 3));
  var dust = new THREE.Points(dGeo, new THREE.PointsMaterial({ color: "#c9a96a", size: 0.45, transparent: true, opacity: 0.32, depthWrite: false }));
  scene.add(dust);

  function sampleFace(img) {
    var S = Math.round(Math.sqrt(N / 0.74)), c = document.createElement("canvas"); c.width = c.height = S;
    var ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, S, S);
    var d = ctx.getImageData(0, 0, S, S).data, idx = [];
    for (var y = 0; y < S; y++) for (var x = 0; x < S; x++) { var dx = x / S - 0.5, dy = y / S - 0.5; if (dx * dx + dy * dy <= 0.236) idx.push(y * S + x); }
    for (var k = idx.length - 1; k > 0; k--) { var j = (Math.random() * (k + 1)) | 0, tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp; }
    var b = new Buf(N);
    for (k = 0; k < N && k < idx.length; k++) {
      var id = idx[k], xx = id % S, yy = (id / S) | 0, q = id * 4, rr2 = d[q] / 255, g = d[q + 1] / 255, bl = d[q + 2] / 255, lum = 0.299 * rr2 + 0.587 * g + 0.114 * bl;
      b.put((xx / S - 0.5) * 60 + (Math.random() - 0.5) * 60 / S, -(yy / S - 0.5) * 60 + (Math.random() - 0.5) * 60 / S, (lum - 0.45) * 16, [Math.min(1, rr2 * 1.08), Math.min(1, g * 1.08), Math.min(1, bl * 1.08)], 0);
    }

  }
  var shapes = {}, want = null, faceImg = null, spin = 0;
  function shape(key) {
    if (shapes[key]) return shapes[key];
    if (key === "me") { if (!faceImg) return null; shapes.me = sampleFace(faceImg); }
    else if (GEN[key]) { var b = new Buf(N); GEN[key](b); shapes[key] = b.finish(); }
    return shapes[key];
  }
  var img = new Image();
  img.onload = function () { faceImg = img; if (want === "me") morph("me"); };
  img.src = "assets/face.jpg";

  var startT = 0, clock = new THREE.Clock();
  function easeJs(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function morph(key) {
    want = key; spin = key === "me" ? 0 : 1;
    var s = shape(key); if (!s) return;
    var p = U.uP.value, ofl = U.uFly.value, oar = 1 - U.uArrive.value;
    if (ofl || oar) for (var q = 0; q < N; q++) if (tag[q] < 0.5) {
      var fl = Math.min(1, Math.max(0, ofl * 1.3 - seed[q] * 0.3)), ar = Math.min(1, Math.max(0, oar * 1.3 - seed[q] * 0.3));
      to[q * 3] += 230 * fl * fl - 230 * ar * ar; to[q * 3 + 1] += 70 * fl * fl - 50 * ar * ar; to[q * 3 + 2] += 40 * fl * fl - 30 * ar * ar;
    }
    U.uFly.value = 0; U.uArrive.value = 1;
    for (var i = 0; i < N; i++) {
      var t = Math.min(1, Math.max(0, (p - seed[i] * 0.35) / 0.65)), e = easeJs(t), ix = i * 3;
      for (var c = 0; c < 3; c++) { from[ix + c] += (to[ix + c] - from[ix + c]) * e; cFrom[ix + c] += (cTo[ix + c] - cFrom[ix + c]) * e; }
    }
    to.set(s.pos); cTo.set(s.col); tag.set(s.tag);
    ["aFrom", "aTo", "aCFrom", "aCTo", "aTag"].forEach(function (n) { geo.attributes[n].needsUpdate = true; });
    U.uMode.value = MODE[key] || 0;
    U.uP.value = reduce ? 1 : 0; startT = clock.getElapsedTime();
    var rest = Object.keys(GEN).filter(function (k) { return !shapes[k]; });
    if (rest.length && window.requestIdleCallback) requestIdleCallback(function () { shape(rest[0]); }, { timeout: 1500 });
  }

  var mouseT = new THREE.Vector2(9999, 9999), mouseOnT = 0, nx = 0, ny = 0, v3 = new THREE.Vector3();
  function pointer(e) {
    var rct = canvas.getBoundingClientRect(); if (!rct.width) return;
    var x = (e.clientX - rct.left) / rct.width, y = (e.clientY - rct.top) / rct.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) { mouseOnT = 0; nx = ny = 0; return; }
    nx = x * 2 - 1; ny = -(y * 2 - 1);

    var t = -camera.position.z / v3.z; v3.multiplyScalar(t).add(camera.position).applyMatrix4(camera.matrixWorldInverse);

  window.addEventListener("pointerdown", pointer);
  document.documentElement.addEventListener("pointerleave", function () { mouseOnT = 0; nx = ny = 0; });
  function release(e) { if (e.pointerType !== "mouse") { mouseOnT = 0; nx = ny = 0; } }
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);

  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var avail = w, cx = w / 2;
    if (window.innerWidth > 860) {
      var L = document.querySelector(".index").offsetWidth, R = document.getElementById("panel").offsetWidth;
      avail = Math.max(260, w - L - R); cx = L + avail / 2;
    }
    camera.setViewOffset(w, h, w / 2 - cx, 0, w, h);
    camera.position.z = (window.innerWidth > 860 ? 74 : 92) / (2 * Math.tan(19 * Math.PI / 180) * Math.min(1, avail / h));
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    U.uScale.value = Math.max(0.6, Math.min(1.35, h / 800));
    var perUnit = h / (2 * camera.position.z * Math.tan(19 * Math.PI / 180)), link = document.getElementById("pageLink");
    link.style.width = 46 * perUnit + "px"; link.style.height = 60 * perUnit + "px"; link.style.left = cx + "px";
  }
  window.addEventListener("resize", resize); resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

  var spinCur = 0;
  function frame() {
    var t = clock.getElapsedTime();
    U.uTime.value = t;
    if (!reduce) U.uP.value = Math.min(1, (t - startT) / DUR);
    if (U.uMouse.value.x > 9000 && mouseOnT) U.uMouse.value.copy(mouseT); else U.uMouse.value.lerp(mouseT, 0.2);
    U.uMouseOn.value += (mouseOnT - U.uMouseOn.value) * 0.1;
    spinCur += (spin - spinCur) * 0.04;
    var motion = reduce ? 0 : 1;
    var ry = (Math.sin(t * 0.32) * 0.1 + spinCur * Math.sin(t * 0.22) * 0.55) * motion + nx * (0.14 + spinCur * 0.1);
    var rx = -ny * 0.1 + spinCur * Math.sin(t * 0.17) * 0.06 * motion;

    points.rotation.x += (rx - points.rotation.x) * 0.05;
    if (!reduce) dust.rotation.y = t * 0.01;
    if (want === "contact" && !reduce) {
      /* hold, fly off to the right, stay gone, a new plane glides in from the left */
      var c = (t - startT - DUR) % 13;
      if (t - startT < DUR) { U.uFly.value = 0; U.uArrive.value = 1; }
      else if (c < 5) { U.uFly.value = 0; U.uArrive.value = 1; }
      else if (c < 7.4) { U.uFly.value = (c - 5) / 2.4; U.uArrive.value = 1; }
      else if (c < 10.5) { U.uFly.value = 1; U.uArrive.value = 1; }
      else { U.uFly.value = 0; U.uArrive.value = (c - 10.5) / 2.5; U.uArrive.value = 1 - Math.pow(1 - U.uArrive.value, 2); }
    }

  requestAnimationFrame(frame);

}

/* ================= cursor modes ================= */
["lift", "ripple", "swirl", "magnet", "scatter"].forEach(function (name, i, all) {
  var m = document.getElementById("modes"), b = document.createElement("button");
  b.type = "button"; b.className = "mode"; b.textContent = name; b.setAttribute("aria-pressed", String(i === 0));
  b.addEventListener("click", function () {
    Array.prototype.forEach.call(m.children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    if (particles) particles.cursor(i);
  });
  m.appendChild(b);
});

/* ================= visit counter ================= */
fetch("/api/visit-count", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
  if (!d || typeof d.count !== "number") return;
  var els = document.querySelectorAll(".visitN"), t0 = performance.now();
  function show(v) { var txt = v.toLocaleString("en-US"); Array.prototype.forEach.call(els, function (el) { el.textContent = txt; }); }
  if (reduce) { show(d.count); return; }
  (function step(now) { var k = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - k, 3); show(Math.round(d.count * e)); if (k < 1) requestAnimationFrame(step); })(t0);
}).catch(function () {});

/* ================= boot ================= */
var started = false;
function start() {
  if (started) return; started = true;
  try { particles = Particles(document.getElementById("gl")); }
  catch (e) { particles = null; hintEl.textContent = "3D isn't available in this browser"; }
  var h = (location.hash || "").replace("#", "");
  select(BY[h] ? h : "me", false);
  setTimeout(function () { document.getElementById("loading").classList.add("done"); }, 150);
}
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load("400 40px 'Instrument Serif'"), document.fonts.load("italic 400 40px 'Instrument Serif'"), document.fonts.load("400 30px 'Tiro Devanagari Hindi'", "ईशान अग्रवाल"), document.fonts.load("400 16px 'Geist'"), document.fonts.load("400 12px 'Geist Mono'")]).then(start, start);
  setTimeout(start, 2500);
} else start();
})();
